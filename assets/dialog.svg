<svg xmlns="http://www.w3.org/2000/svg" width="900" height="270" viewBox="0 0 900 270" font-family="'Press Start 2P', ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace" font-weight="700"><defs>
