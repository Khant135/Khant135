@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="900" height="270" rx="16" fill="#12142a"/><rect x="10" y="10" width="880" height="250" fill="none" stroke="#4cc9f0" stroke-width="4"/><rect x="20" y="20" width="860" height="230" fill="none" stroke="#ff4d9d" stroke-width="2" stroke-dasharray="8 6"/>
