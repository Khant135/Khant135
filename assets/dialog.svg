<image x="56" y="58" width="136" height="136" style="image-rendering:pixelated" href="data:image/png;base64,"/>
<rect x="48" y="50" width="152" height="152" fill="none" stroke="#ffd166" stroke-width="4"/>
<rect x="60" y="214" width="128" height="26" fill="#ff4d9d"/><text x="124" y="233" text-anchor="middle" class="w" font-size="14">MIN</text>
<clipPath id="l0"><rect x="0" y="72" height="28" width="0"><animate attributeName="width" from="0" to="900" begin="0.60s" dur="1.10s" fill="freeze"/></rect></clipPath><text x="236" y="92" class="w" font-size="15" clip-path="url(#l0)">Hey! I'm Min, a web developer from Yangon.</text><clipPath id="l1"><rect x="0" y="102" height="28" width="0"><animate attributeName="width" from="0" to="900" begin="1.70s" dur="1.10s" fill="freeze"/></rect></clipPath><text x="236" y="122" class="w" font-size="15" clip-path="url(#l1)">By day I build products at Myanmar Technology</text><clipPath id="l2"><rect x="0" y="132" height="28" width="0"><animate attributeName="width" from="0" to="900" begin="2.80s" dur="1.10s" fill="freeze"/></rect></clipPath><text x="236" y="152" class="w" font-size="15" clip-path="url(#l2)">Gateway and Leap Technology with Laravel, Vue,</text><clipPath id="l3"><rect x="0" y="162" height="28" width="0"><animate attributeName="width" from="0" to="900" begin="3.90s" dur="1.10s" fill="freeze"/></rect></clipPath><text x="236" y="182" class="w" font-size="15" clip-path="url(#l3)">React and Ionic. After hours I'm levelling up</text><clipPath id="l4"><rect x="0" y="192" height="28" width="0"><animate attributeName="width" from="0" to="900" begin="5.00s" dur="1.10s" fill="freeze"/></rect></clipPath><text x="236" y="212" class="w" font-size="15" clip-path="url(#l4)">on TypeScript backends: NestJS, Prisma, Next.js.</text>
<text x="836" y="240" text-anchor="end" class="y" font-size="16" opacity="0">▼<set attributeName="opacity" to="1" begin="6.1s" fill="freeze"/>
<animate attributeName="opacity" values="1;0;1" dur="1s" begin="6.1s" repeatCount="indefinite"/></text>
