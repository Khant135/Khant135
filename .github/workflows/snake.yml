name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#ffd166&color_dots=#1b1e3a,#2b3a67,#4cc9f0,#ff4d9d,#ffd166

      # Give the transparent SVG the arcade-screen background so it matches the rest of the profile
      - name: Add arcade background
        run: sudo sed -i -E 's#(<svg[^>]*>)#\1<rect x="-50%" y="-50%" width="200%" height="200%" fill="\#12142a"/>#' dist/github-snake.svg

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
